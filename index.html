<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IssuBoard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>📋 IssuBoard</h1>
    <div id="repo-info">
      <span id="repo-display">Loading...</span>
    </div>
  </header>

  <main>
    <div id="kanban-board">
      <div class="kanban-column" data-status="backlog">
        <div class="column-header">
          <h2>📋 Backlog</h2>
          <span class="issue-count" id="count-backlog">0</span>
        </div>
        <div class="column-body" id="column-backlog"></div>
      </div>
      <div class="kanban-column" data-status="in-progress">
        <div class="column-header">
          <h2>🔨 In Progress</h2>
          <span class="issue-count" id="count-in-progress">0</span>
        </div>
        <div class="column-body" id="column-in-progress"></div>
      </div>
      <div class="kanban-column" data-status="done">
        <div class="column-header">
          <h2>✅ Done</h2>
          <span class="issue-count" id="count-done">0</span>
        </div>
        <div class="column-body" id="column-done"></div>
      </div>
    </div>
  </main>

  <footer>
    <p>Powered by <a href="https://github.com/GamerSheepBoy/IssuBoard" target="_blank">IssuBoard</a> | <a href="https://docs.github.com/ja/rest/issues/issues" target="_blank">GitHub Issues API</a></p>
  </footer>

  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/kanban.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
